[pytest]
testpaths = ["tests"]
strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# One xdist worker per logical CPU. Without psutil, xdist counts logical CPUs
# with os.sched_getaffinity or os.cpu_count. `-n0` runs in one process, as
# --pdb needs.
addopts = ["-ra", "-n", "logical"]
filterwarnings = ["error"]
markers = [
    "container: needs Docker (the daemon or the CLI); skip with -m 'not container'",
]
