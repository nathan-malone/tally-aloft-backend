# A pushed tag vX.Y.Z publishes the committed openapi.json as its release's
# asset, which the clients sync from. The verify job reads the repository and
# checks the file is current and breaks no supported release's schema. Only
# the publish job can write, and it runs no project code: it never checks out
# the repository.
name: Release

# Only vX.Y.Z tags, the form supported-schema-releases.txt accepts; GitHub's
# filter must match the whole tag name.
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every uv command asserts that uv.lock is current and never rewrites it.
  UV_LOCKED: "1"

jobs:
  verify:
    name: Verify the API schema
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    # uv installs the locked environment itself, so no other setup is needed.
    - name: Check the API schema is current
      run: make openapi.check
    # The default branch holds the current list. A tag on an older branch, such
    # as a hotfix's, carries the list from when that branch was cut.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: default-branch
        sparse-checkout: supported-schema-releases.txt
        sparse-checkout-cone-mode: false
        persist-credentials: false
    # A tag can point at a commit that never passed the pull-request checks,
    # so nothing is published that breaks a currently supported release's
    # schema. It fetches those schemas with the read-only token, and skips the
    # tag being released, so a re-run of a listed tag's own release, to
    # restore its asset, isn't checked against that missing asset. Skipping it
    # is safe, because publish never replaces an asset the tag already has.
    - name: Check the API schema for breaking changes
      run: make openapi.breaking.check ARGS="--releases default-branch/supported-schema-releases.txt --skip $TAG"
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openapi
        path: openapi.json
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish the API schema
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    # The tag reaches the shell only through the environment, never through an
    # expression in a command. gh needs GH_REPO, because there is no checkout.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: openapi
    # A new release gets the asset as it is created: gh creates a draft, uploads,
    # then publishes, so the release is never public without openapi.json. An
    # existing release gets the asset only if it has none, such as after a
    # failed upload: without --clobber gh refuses to replace one, so a moved
    # tag can't change the schema its clients were built against, and a re-run
    # of a successful publish fails. view also finds a draft that an
    # interrupted create left behind; if it has no asset, that branch uploads
    # one and publishes it, and on a published release the edit changes
    # nothing. A draft that already has the asset fails the upload and needs
    # publishing by hand (see the README). If view fails for any reason but a
    # missing release, create fails too, so no failure is swallowed.
    - name: Publish openapi.json
      run: if gh release view "$TAG" > /dev/null; then gh release upload "$TAG" openapi.json && gh release edit "$TAG" --draft=false; else gh release create "$TAG" openapi.json --verify-tag --title "$TAG" --notes "API schema for $TAG."; fi
