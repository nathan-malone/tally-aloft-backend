# A pushed tag vX.Y.Z publishes the committed openapi.json as its release's
# asset, which the clients sync from. The verify job reads the repository and
# checks the file is current; only the publish job can write, and it runs no
# project code: it never checks out the repository.
name: Release

# Only vX.Y.Z tags, the form supported-schema-releases.txt accepts; GitHub's
# filter must match the whole tag name.
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every uv command asserts that uv.lock is current and never rewrites it.
  UV_LOCKED: "1"

jobs:
  verify:
    name: Verify the API schema
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    # uv installs the locked environment itself, so no other setup is needed.
    - name: Check the API schema is current
      run: make openapi.check
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: openapi
        path: openapi.json
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish the API schema
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    # The tag reaches the shell only through the environment, never through an
    # expression in a command. gh needs GH_REPO, because there is no checkout.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: openapi
    # A new release gets the asset as it is created: gh creates a draft, uploads,
    # then publishes, so the release is never public without openapi.json. On a
    # re-run the release exists, and --clobber deletes and re-uploads the asset,
    # which is missing in between; a failed upload is fixed by re-running this
    # job. view also finds a draft that an interrupted create left behind, so
    # that branch then publishes it; on a published release that changes
    # nothing. If view fails for any reason but a missing release, create fails
    # too, so no failure is swallowed.
    - name: Publish openapi.json
      run: if gh release view "$TAG" > /dev/null; then gh release upload "$TAG" openapi.json --clobber && gh release edit "$TAG" --draft=false; else gh release create "$TAG" openapi.json --verify-tag --title "$TAG" --notes "API schema for $TAG."; fi
