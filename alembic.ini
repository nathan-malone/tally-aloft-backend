# Alembic's settings. The database URL isn't here: migrations/env.py reads it
# from MigrationSettings (TALLY_MIGRATION_DATABASE_URL), as the owner role.
#
#   make migrations.apply    (alembic upgrade head)

[alembic]
script_location = %(here)s/migrations
# Files sort by date, then revision ID.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
# Lists such as version_locations split on os.pathsep. Without this, Alembic
# warns and splits on spaces, which breaks paths that contain one.
path_separator = os

# Alembic renders autogenerated code with single quotes and long lines, so each
# new revision is fixed and formatted by the locked Ruff, as `make lint.fix`
# would. A hook's failure doesn't stop Alembic; `make lint.check` still catches
# what's left.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.cwd = %(here)s
ruff_fix.options = check --fix --config ruff.toml REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.cwd = %(here)s
ruff_format.options = format --config ruff.toml REVISION_SCRIPT_FILENAME

# Logging for the alembic command, configured by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
