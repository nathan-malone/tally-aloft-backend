# The AI-slop check (make slop.check). Ruff owns formatting and linting, and
# Import Linter owns architecture, so those engines are off here.
version: 1
engines:
  format: false
  lint: false
  code-quality: true
  ai-slop: true
  architecture: false
  security: true
security:
  # Dependency audits need the network and an auditor; scans stay offline.
  audit: false
ci:
  # Any finding fails the check, and so does an engine that can't run.
  failBelow: 100
  failOnMissingTools: true
telemetry:
  enabled: false
