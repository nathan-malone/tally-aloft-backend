[project]
name = "tally-aloft"
version = "0.1.0"
description = "Tally Aloft backend: the API, background workers and scheduler."
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.150.0",
    "logfire[asyncpg,fastapi,redis]>=5.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "filelock>=4.2.4",
    "import-linter>=2.15",
    "polyfactory>=3.3.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
    "types-docker>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.14"
# Resolve only to releases at least 7 days old, so a compromised release is
# usually yanked before it can be locked. uv.lock records the span, not a
# date, so the lock stays valid as days pass. An exception goes in
# exclude-newer-package, with a reason and a removal date on its line.
exclude-newer = "7 days"

